name: Déploiement GitHub Pages & Publication Quotidienne

on:
  push:
    branches: [dev, main]
  # Exécution quotidienne programmée à une minute impaire hors pic (02h17 UTC = 04h17 heure de Paris en été / 03h17 en hiver)
  schedule:
    - cron: '17 2 * * *'
  # Déclenchement manuel avec paramètres
  workflow_dispatch:
    inputs:
      generate_article:
        description: "Générer un nouvel article avec Gemini avant de déployer ?"
        required: true
        type: boolean
        default: true
      subject:
        description: "Sujet ou question libre (ex: 'Le regret chez les machines', 'Spinoza et les algorithmes')"
        required: false
        default: ""
      theme:
        description: "Grand thème du site (optionnel si sujet renseigné : conscience, langage, ethique, travail, creativite, relations, pouvoir, attention)"
        required: false
        default: ""
      format:
        description: "Format de l'article (vide pour aléatoire : essai, question, dialogue, note)"
        required: false
        default: ""

# Évite les déploiements concurrents simultanés
concurrency:
  group: 'pages'
  cancel-in-progress: true

# Permissions requises pour écrire le nouveau fichier, le pousser et déployer sur GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate_and_build:
    name: Génération Gemini & Build Astro
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4
        with:
          # On se positionne sur la branche actuelle déclenchée (dev ou main)
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      # -------------------------------------------------------------
      # ÉTAPE : Appel API Gemini si cron quotidien ou déclenchement demandé
      # -------------------------------------------------------------
      - name: 🤖 Génération philosophique quotidienne avec Gemini
        if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate_article == true)) }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_THEME: ${{ inputs.theme }}
          INPUT_FORMAT: ${{ inputs.format }}
          INPUT_SUBJECT: ${{ inputs.subject }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "❌ Erreur : Le secret GEMINI_API_KEY n'est pas configuré dans les secrets du dépôt."
            exit 1
          fi

          echo "Lancement de generate-article.mjs..."
          node scripts/generate-article.mjs "$INPUT_THEME" "$INPUT_FORMAT" "$INPUT_SUBJECT"

      # -------------------------------------------------------------
      # ÉTAPE : Build AVANT tout commit
      # Un article dont le frontmatter ne respecte pas le schéma de
      # src/content.config.ts fait échouer le build. En commitant d'abord,
      # on poussait un fichier invalide qui cassait ensuite tous les
      # déploiements, y compris ceux sans génération.
      # -------------------------------------------------------------
      - name: 🏗️ Build de validation (avant commit)
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      # -------------------------------------------------------------
      # ÉTAPE : Commit et push du nouveau texte sur la branche active
      # -------------------------------------------------------------
      - name: 📝 Commit et Push du texte généré
        if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate_article == true)) }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git status
          if [ -n "$(git status --porcelain src/content/textes/)" ]; then
            git add src/content/textes/
            git commit -m "chore(auto): texte philosophique quotidien (Gemini) [skip ci]"
            # On pousse sur la branche courante
            git push origin HEAD:${{ github.ref_name }}
            echo "✓ Nouveau texte commité et poussé avec succès."
          else
            echo "Aucun nouveau fichier texte à commiter."
          fi

      # -------------------------------------------------------------
      # ÉTAPE : Ping Supabase pour éviter la mise en pause du projet
      # -------------------------------------------------------------
      - name: ⚡ Ping Supabase (maintien du projet actif)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Ping de Supabase pour maintenir le projet gratuit actif..."
            curl -fsS "${SUPABASE_URL}/rest/v1/ping?select=id&limit=1" \
              -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
              && echo "✓ Supabase ping réussi" || echo "⚠️ Ping Supabase échoué (non bloquant)"
          else
            echo "Secrets SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY non configurés (étape ignorée)."
          fi

      # Le build a déjà été exécuté plus haut (« Build de validation ») :
      # on réutilise ./dist pour l'artefact Pages.

      - name: ⚙️ Configuration de GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}
        uses: actions/configure-pages@v5

      - name: 📦 Téléversement de l'artefact Pages
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Déploiement sur GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: generate_and_build
    # Seule la branche main (et le cron) publie : un push sur dev ne doit pas
    # remplacer le site en production.
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Déploiement vers GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
